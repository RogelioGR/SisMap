<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Mapa sísmico en tiempo real con alertas de tsunami y sismos cercanos.">
    <title>Mapa Sísmico</title>
    <link rel="icon" type="image/png" href="./assets/iconoApp.png">
    <link rel="manifest" href="./manifest.webmanifest">
    
    <link rel="stylesheet" href="./assets/css/leaflet.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/Loader.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="header-left">
                <img src="./assets/iconoApp.png" alt="Logo" class="logo">
                <div class="brand">SisMap</div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="locateMe()" title="Mi ubicación"><i class="fa-solid fa-location-crosshairs"></i></button>
                <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
                <button class="btn-icon" onclick="SettingsService.open()" title="Ajustes" aria-label="Abrir panel de ajustes"><i class="fa-solid fa-sliders"></i></button>
            </div>
        </header>

        <main id="main">
            <div id="map"></div>
            
            <div id="map-ctrl">
                <button class="btn-icon ctrl ac" onclick="MapService.instance.zoomIn()" title="Acercar"><i class="fa-solid fa-plus"></i></button>
                <button class="btn-icon ctrl ac" onclick="MapService.instance.zoomOut()" title="Alejar"><i class="fa-solid fa-minus"></i></button>
                <button class="btn-icon ctrl ac" id="btn-evac" onclick="MapService.toggleEvacuationRoutes()" title="Rutas de evacuación" aria-label="Alternar rutas de evacuación"><i class="fa-solid fa-person-running"></i></button>
            </div>

            <div id="bottom-sheet" class="bottom-sheet collapsed">
                <div class="sheet-handle" id="sheet-handle"></div>
                <div class="sheet-header" id="sheet-header">
                    <div class="sheet-title">
                        <i class="fa-solid fa-wave-square"></i>
                        <span>Terremotos recientes</span>
                    </div>
                    <div class="sheet-actions">
                        <button class="sheet-filter-btn" onclick="toggleFilters()" title="Filtrar"><i class="fa-solid fa-filter"></i></button>
                        <button class="sheet-chevron" id="chevron-btn" onclick="toggleSheet()"><i class="fa-solid fa-chevron-down" id="chevron-icon"></i></button>
                    </div>
                </div>

                <nav id="navbar">
                    <button class="fbtn active" data-filter="all" onclick="setFilter('all')">Todos</button>
                    <button class="fbtn" data-filter="red" onclick="setFilter('red')">Alto</button>
                    <button class="fbtn" data-filter="orange" onclick="setFilter('orange')">Medio</button>
                    <button class="fbtn" data-filter="green" onclick="setFilter('green')">Bajo</button>
                </nav>

                <div class="sheet-content-wrapper">
                    <div class="sheet-info">
                        <span id="count-text">Cargando datos…</span>
                        <span id="conn-status" class="conn-status online" role="status">
                            <i class="fa-solid fa-wifi" aria-hidden="true"></i> <span id="conn-status-text">En línea</span>
                        </span>
                        <span id="next-update"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> 60s</span>
                    </div>
                    <div id="cards"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="spinner">
        <div class="loader">
            <span class="dot dot-1"></span>
            <span class="dot dot-2"></span>
            <span class="dot dot-3"></span>
            <span class="dot dot-4"></span>
            <span class="dot dot-5"></span>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="alert-banner">
        <div class="ab-icon-wrap" id="ab-icon-wrap"></div>
        <div class="ab-body">
            <div class="ab-eyebrow" id="ab-eyebrow"></div>
            <div class="ab-title" id="ab-title"></div>
            <div class="ab-msg" id="ab-msg"></div>
            <div class="ab-detail" id="ab-detail"></div>
        </div>
        <button class="ab-close" onclick="hideAlert()" aria-label="Cerrar alerta"><i class="fa-solid fa-xmark"></i></button>
        <div class="ab-progress" id="ab-progress"></div>
    </div>

    <div id="tsunami-modal"></div>

    <!-- PANEL DE AJUSTES -->
    <div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="set-title">
        <div class="set-box">
            <div class="set-head">
                <div class="set-title" id="set-title">
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i> Ajustes
                </div>
                <button class="set-close" onclick="SettingsService.close()" aria-label="Cerrar ajustes"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="set-body">
                <div class="set-group">
                    <label class="set-label" for="set-radius">Radio de sismos cercanos</label>
                    <select id="set-radius" class="set-control" onchange="SettingsService.save({ nearbyRadiusKm: parseInt(this.value) })">
                        <option value="200">200 km</option>
                        <option value="500">500 km</option>
                        <option value="1000">1000 km</option>
                        <option value="1500">1500 km</option>
                        <option value="3000">3000 km</option>
                        <option value="5000">5000 km</option>
                    </select>
                </div>
                <div class="set-group">
                    <label class="set-label" for="set-threshold">Magnitud mínima para alertar</label>
                    <select id="set-threshold" class="set-control" onchange="SettingsService.save({ alertThreshold: parseFloat(this.value) })">
                        <option value="4.5">M 4.5+</option>
                        <option value="5.0">M 5.0+</option>
                        <option value="5.5">M 5.5+</option>
                        <option value="5.9">M 5.9+</option>
                        <option value="6.5">M 6.5+</option>
                        <option value="7.0">M 7.0+</option>
                    </select>
                </div>
                <div class="set-group">
                    <label class="set-label" for="set-unit">Unidad de distancia</label>
                    <select id="set-unit" class="set-control" onchange="SettingsService.save({ distanceUnit: this.value })">
                        <option value="km">Kilómetros (km)</option>
                        <option value="mi">Millas (mi)</option>
                    </select>
                </div>
                <div class="set-group set-toggle-row">
                    <label class="set-label" for="set-sound">Sonido de alertas</label>
                    <label class="set-switch">
                        <input type="checkbox" id="set-sound" onchange="SettingsService.save({ soundEnabled: this.checked })">
                        <span class="set-switch-track"></span>
                    </label>
                </div>

                <div class="set-group set-group-favorites">
                    <label class="set-label">Zonas favoritas</label>
                    <div id="fav-zones-list" class="fav-zones-list"></div>
                    <div class="fav-add-row">
                        <input type="text" id="fav-search-name" class="set-control" placeholder="Nombre (ej. Casa de mis papás)">
                        <input type="text" id="fav-search-city" class="set-control" placeholder="Ciudad a buscar (ej. Guadalajara, MX)">
                        <button class="fav-add-btn" onclick="FavoritesService.searchAndAdd()">
                            <i class="fa-solid fa-plus" aria-hidden="true"></i> Agregar zona
                        </button>
                    </div>
                    <p class="fav-hint">Las alertas de sismo cercano se evaluarán también contra cada zona guardada, además de tu ubicación GPS.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/leaflet.js"></script>
    <script src="./assets/js/app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[SW] Registrado:', reg.scope))
                    .catch(err => console.log('[SW] Error:', err));
            });
        }
    </script>
</body>
</html>
